name: reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://alya-bot-teal.vercel.app/api/cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
